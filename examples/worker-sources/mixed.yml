contract_version: wlo-worker-sources/v0.1
sources:
  - name: local
    command: /absolute/path/to/local-ollama-workers/bin/low
    args:
      - workers
      - --json
    workdir: /absolute/path/to/local-ollama-workers
  - name: remote
    command: /absolute/path/to/runpod-ollama-fleet/bin/rpof
    args:
      - workers
      - --json
    environment:
      RPOF_STATE_ROOT: /absolute/path/to/fleet-state
      RPOF_STATE_REPO_ROOT: /absolute/path/to/runpod-ollama-fleet
    workdir: /absolute/path/to/runpod-ollama-fleet
