contract_version: wlo-worker-sources/v0.2
sources:
  - name: source-a
    policy: required
    command: /absolute/path/to/publisher-a/bin/publish-workers
    args:
      - workers
      - --json
    environment: {}
    workdir: /absolute/path/to/publisher-a
  - name: source-b
    policy: optional
    command: /absolute/path/to/publisher-b/bin/publish-workers
    args:
      - workers
      - --json
    environment: {}
    workdir: /absolute/path/to/publisher-b
